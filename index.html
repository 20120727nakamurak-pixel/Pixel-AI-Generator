
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL AI GENERATOR v3.0</title>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  background:#141925;
  color:#f4f5fa;
  font-family:sans-serif;
  text-align:center;
}

header {
  padding:26px 12px;
  background:#222b40;
  border-bottom:2px solid #414d6b;
}

h1 { margin:0; font-size:25px; letter-spacing:2px; }

header p { color:#aebbd2; font-size:13px; }

main {
  max-width:750px;
  margin:25px auto;
  padding:14px;
}

input {
  width:100%;
  padding:16px;
  border:2px solid #485675;
  border-radius:9px;
  background:#222b40;
  color:white;
  font-size:16px;
}

button {
  padding:13px 24px;
  margin:9px 4px;
  border:0;
  border-radius:8px;
  background:#7865ed;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover { filter:brightness(1.15); }

.panel {
  margin-top:20px;
  padding:18px;
  background:#222b40;
  border-radius:12px;
}

canvas {
  width:min(100%,512px);
  height:auto;
  image-rendering:pixelated;
  border:5px solid #53617e;
  background:#9cc8e2;
}

#status {
  color:#b8c4da;
  font-size:13px;
  min-height:20px;
}

#analysis {
  padding:14px;
  background:#151b29;
  border-radius:8px;
  text-align:left;
  font-size:13px;
  line-height:1.9;
  overflow-wrap:anywhere;
}

.download { background:#218b70; }
.clear { background:#59667d; }

.examples {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
  margin-top:14px;
}

.examples button {
  background:#37435e;
  font-size:12px;
  padding:9px 12px;
}

footer {
  padding:25px;
  color:#78849d;
  font-size:12px;
}
</style>
</head>

<body>

<header>
  <h1>PIXEL AI GENERATOR</h1>
  <p>Advanced Language Analysis & Pixel Art Engine v3.0</p>
</header>

<main>

  <h2>描きたいものを入力してください</h2>

  <input id="prompt"
    placeholder="例：リンゴを食べる巨大な赤いドラゴン"
    maxlength="200">

  <button onclick="generate()">AI生成開始</button>
  <button class="clear" onclick="clearCanvas()">リセット</button>

  <div class="examples">
    <button onclick="example('リンゴを食べる巨大な赤いドラゴン')">ドラゴン</button>
    <button onclick="example('森を歩く白い猫')">白い猫</button>
    <button onclick="example('剣を持つ勇者と巨大な城')">勇者と城</button>
    <button onclick="example('夜空を飛ぶ金色の鳥')">金色の鳥</button>
    <button onclick="example('海を泳ぐ青い魚')">青い魚</button>
  </div>

  <div class="panel">

    <h3>GENERATED PIXEL ART</h3>

    <canvas id="canvas" width="128" height="128"></canvas>

    <p id="status">生成待機中...</p>

    <div id="analysis">
      AI解析エンジン：待機中
    </div>

    <button class="download" onclick="downloadImage()">
      PNG画像を保存
    </button>

  </div>

</main>

<footer>
  PIXEL AI GENERATOR v3.0
</footer>

<script>

// ==================================================
// 1. 独自AI・言語解析辞書
// ==================================================

const AI = {

  dictionary: {

    dragon:["ドラゴン","竜","龍","りゅう","ドラゴン族"],

    cat:["猫","ねこ","ネコ","子猫"],

    dog:["犬","いぬ","イヌ","子犬"],

    wolf:["狼","オオカミ","おおかみ"],

    bird:["鳥","とり","小鳥","鷹","ワシ"],

    fish:["魚","さかな","魚類","金魚"],

    person:["人間","人","男","女","男性","女性",
      "少年","少女","男の子","女の子","勇者",
      "騎士","戦士","魔法使い","冒険者"],

    apple:["リンゴ","りんご","林檎","アップル"],

    banana:["バナナ"],

    meat:["肉","お肉","ステーキ"],

    sword:["剣","刀","ソード"],

    shield:["盾","シールド"],

    staff:["杖","魔法の杖"],

    watering:["ジョウロ","じょうろ","水差し"],

    house:["家","小屋","住宅","民家"],

    castle:["城","お城","城塞","王城"],

    tree:["木","樹木","大樹","木々"],

    flower:["花","植物","花壇","チューリップ"],

    mushroom:["キノコ","きのこ","茸"],

    mountain:["山","山岳","岩山"],

    cloud:["雲"],

    moon:["月","三日月"],

    sun:["太陽","日","夕日"],

    star:["星","星空","流星"],

    boat:["船","ボート","舟"]

  },

  colors: {

    red:["赤い","赤色","赤","紅色","真っ赤な"],

    blue:["青い","青色","青","蒼い"],

    green:["緑色","緑","緑の"],

    white:["白い","白色","白","真っ白な"],

    black:["黒い","黒色","黒","真っ黒な"],

    yellow:["黄色","黄色い","黄"],

    purple:["紫色","紫","紫の"],

    gold:["金色","黄金","金の"],

    pink:["ピンク","桃色","桃色の"],

    orange:["オレンジ","橙色","橙"],

    brown:["茶色","茶色の"]

  },

  actions: {

    eat:["食べる","食べて","食べた","食べ","食事する","かじる"],

    hold:["持つ","持って","持った","握る","握って","手にする"],

    fly:["飛ぶ","飛んで","飛行する","空を舞う","羽ばたく"],

    run:["走る","走って","駆ける","駆けて"],

    walk:["歩く","歩いて","散歩する","進む"],

    sit:["座る","座って","腰掛ける"],

    sleep:["眠る","寝る","寝て","昼寝する"],

    swim:["泳ぐ","泳いで","水中を進む"],

    fight:["戦う","戦って","攻撃する","戦闘する"],

    water:["水をあげる","水やり","水を与える"],

    look:["見る","眺める","見つめる"],

    carry:["運ぶ","運んで","背負う","背負って"]

  },

  modifiers: {

    giant:["巨大な","大きな","大きい","巨体の","特大の"],

    small:["小さい","小さな","小型の","ちいさな"],

    cute:["かわいい","可愛い","愛らしい"],

    scary:["恐ろしい","怖い","凶暴な","邪悪な"],

    beautiful:["美しい","綺麗な","きれいな","優雅な"],

    old:["古い","古びた","老いた"],

    young:["若い","幼い","子供の"]

  },

  backgrounds: {

    forest:["森","森林","林","森の中"],

    sea:["海","海中","海底","海の中"],

    grass:["草原","野原","平原","草地"],

    night:["夜","夜空","真夜中"],

    desert:["砂漠","砂丘"],

    snow:["雪原","雪山","雪","氷原"],

    city:["街","町","都市"],

    castle:["城","王城","城内"],

    space:["宇宙","星空","銀河"]

  },

  match(text,dict) {

    let found=[];

    for(const key in dict) {

      const words=dict[key];

      const matches=words
        .filter(w=>text.includes(w))
        .sort((a,b)=>b.length-a.length);

      if(matches.length) {

        found.push({
          type:key,
          word:matches[0],
          length:matches[0].length
        });

      }
    }

    return found;
  },

  analyze(text) {

    const entities=this.match(text,this.dictionary);
    const colors=this.match(text,this.colors);
    const actions=this.match(text,this.actions);
    const modifiers=this.match(text,this.modifiers);
    const backgrounds=this.match(text,this.backgrounds);

    // 最初の動作を採用
    const action=actions[0]?.type || "normal";

    // 主体と対象の推定
    let primary=entities[0] || null;
    let secondary=entities.slice(1);

    // 「食べる」の対象を優先
    if(action==="eat") {

      const edible=["apple","banana","meat","fish"];

      const food=entities.find(
        e=>edible.includes(e.type)
      );

      const actor=entities.find(
        e=>!edible.includes(e.type)
      );

      if(actor) primary=actor;

      secondary=entities.filter(e=>e!==primary);

      if(food && secondary.indexOf(food)<0) {
        secondary.unshift(food);
      }
    }

    // 複数主体の認識
    const multiple=entities.filter(e=>
      ["dragon","cat","dog","wolf","bird","person"].includes(e.type)
    );

    // 色の関連付け
    const color=colors[0]?.type || null;

    // 背景の判定
    const background=backgrounds[0]?.type || "grass";

    // 動作対象の推定
    const target=secondary[0] || null;

    return {

      original:text,
      entities,
      primary,
      secondary,
      multiple,
      action,
      target,
      color,
      backgrounds,
      background,
      modifiers,

      size:modifiers.some(m=>m.type==="giant")?1.15:
           modifiers.some(m=>m.type==="small")?0.75:1,

      mood:modifiers.some(m=>m.type==="cute")?"cute":
           modifiers.some(m=>m.type==="scary")?"scary":"normal"

    };
  }

};


// ==================================================
// 2. 128×128描画エンジン
// ==================================================

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const PALETTE={

  red:["#8d282c","#c83c40","#ed6660","#ffaaa0"],
  blue:["#24446f","#3977aa","#65b3d9","#a4def2"],
  green:["#244e35","#347c47","#62ad5d","#a1d47b"],
  white:["#798b9b","#c5d1da","#edf2f4","#ffffff"],
  black:["#171b27","#343e4c","#586579","#8492a2"],
  yellow:["#927029","#d2a83d","#f0d36c","#fff0a0"],
  purple:["#47305f","#7652a0","#a67bc9","#d7b6ed"],
  gold:["#80551e","#bd8a32","#e7bd57","#ffe9a0"],
  pink:["#86415e","#c46c94","#eb9fbe","#ffd2df"],
  orange:["#8c4625","#c76b35","#ef9c4d","#ffd08a"],
  brown:["#51352a","#87573b","#b68157","#dfb58a"]

};

function P(x,y,color,w=1,h=1) {

  ctx.fillStyle=color;
  ctx.fillRect(
    Math.round(x),
    Math.round(y),
    Math.round(w),
    Math.round(h)
  );

}

function line(x1,y1,x2,y2,color) {

  ctx.strokeStyle=color;
  ctx.lineWidth=1;

  ctx.beginPath();
  ctx.moveTo(x1+.5,y1+.5);
  ctx.lineTo(x2+.5,y2+.5);
  ctx.stroke();

}

function palette(color) {

  return PALETTE[color] || PALETTE.green;

}


// ==================================================
// 3. 背景生成
// ==================================================

function drawBackground(type) {

  const backgrounds={

    grass:{
      sky:"#9bcee9",
      ground:"#638f4b",
      detail:"#9bc66b"
    },

    forest:{
      sky:"#789f9b",
      ground:"#31583d",
      detail:"#56884b"
    },

    sea:{
      sky:"#4d9cc5",
      ground:"#286c9c",
      detail:"#65c2dc"
    },

    night:{
      sky:"#171e42",
      ground:"#30334f",
      detail:"#7479a0"
    },

    desert:{
      sky:"#e9b879",
      ground:"#bd8b4e",
      detail:"#e2b56e"
    },

    snow:{
      sky:"#a9cce6",
      ground:"#d7e5ed",
      detail:"#ffffff"
    },

    city:{
      sky:"#9bb5cb",
      ground:"#626c78",
      detail:"#9ca8b2"
    },

    castle:{
      sky:"#9ab8d4",
      ground:"#607d58",
      detail:"#94ad78"
    },

    space:{
      sky:"#11132d",
      ground:"#262747",
      detail:"#44436c"
    }

  };

  const b=backgrounds[type] || backgrounds.grass;

  P(0,0, b.sky,128,128);

  // 背景の光
  if(type==="night" || type==="space") {

    for(let i=0;i<45;i++) {

      const x=(i*37+11)%128;
      const y=(i*23+7)%80;

      P(x,y,i%4===0?"#f9e9a0":"#c5d8ed");

    }

    if(type==="night") {
      P(96,12,"#f5e6a3",12,12);
      P(92,10,b.sky,12,12);
    }

  } else {

    // 雲
    P(12,15,"#e8f3f7",18,4);
    P(17,12,"#ffffff",9,3);
    P(84,23,"#e8f3f7",22,4);
    P(89,20,"#ffffff",10,3);

    // 太陽
    P(104,8,"#f5d875",12,12);
    P(107,6,"#fff0a0",6,2);

  }

  // 地面
  P(0,93,b.ground,128,35);
  P(0,93,b.detail,128,3);

  // 地面模様
  for(let i=0;i<35;i++) {

    const x=(i*31+7)%128;
    const y=98+(i*17)%27;

    P(x,y,b.detail,2,1);

  }

  // 背景オブジェクト
  if(type==="forest") {

    drawBackgroundTree(8,45);
    drawBackgroundTree(102,42);

  }

  if(type==="desert") {

    P(10,83,"#e8c17e",30,5);
    P(82,76,"#e8c17e",38,7);

  }

  if(type==="sea") {

    for(let i=0;i<8;i++) {

      P(i*19,103+(i%3)*5,"#5ab7d1",9,1);

    }

  }

  if(type==="city") {

    P(4,55,"#6e778b",17,38);
    P(27,42,"#7d879a",20,51);
    P(83,54,"#707d91",18,39);
    P(106,46,"#818b9d",18,47);

  }

  if(type==="castle") {

    P(4,50,"#8795a5",22,43);
    P(102,50,"#8795a5",22,43);

  }

}

function drawBackgroundTree(x,y) {

  P(x+8,y+18,"#65432f",7,30);
  P(x,y+4,"#234f38",23,22);
  P(x+5,y,"#38754b",15,24);
  P(x+8,y+5,"#65a85b",8,8);

}


// ==================================================
// 4. ドラゴン
// ==================================================

function drawDragon(color="green",action="normal",mood="normal") {

  const c=palette(color);

  // 尻尾
  P(13,73,c[0],25,8);
  P(5,76,c[1],12,5);
  P(2,73,c[0],7,9);
  P(3,71,c[3],3,3);

  // 翼・左
  P(19,24,c[0],21,37);
  P(12,32,c[1],13,23);
  P(8,44,c[0],12,15);
  P(8,58,c[1],18,5);

  line(21,27,12,57,c[3]);
  line(24,30,19,58,c[3]);
  line(29,31,27,57,c[3]);

  // 翼・右
  P(55,23,c[0],18,37);
  P(65,30,c[1],13,23);
  P(73,43,c[0],11,15);
  P(60,56,c[1],19,5);

  line(58,27,69,57,c[3]);
  line(63,30,76,57,c[3]);
  line(68,33,80,55,c[3]);

  // 翼の爪
  P(9,56,c[0],5,6);
  P(76,55,c[0],5,7);

  // 胴体
  P(23,51,c[0],45,34);
  P(27,49,c[1],36,31);
  P(32,54,c[2],25,24);

  // 腹部
  P(35,58,"#a4b982",19,22);
  P(36,62,"#c6d49b",16,2);
  P(36,68,"#c6d49b",16,2);
  P(36,74,"#c6d49b",16,2);

  // 足
  P(27,78,c[0],13,17);
  P(30,82,c[1],8,12);
  P(54,78,c[0],13,17);
  P(57,82,c[1],8,12);

  // 爪
  P(29,94,"#e4e4d0",4,3);
  P(36,94,"#e4e4d0",4,3);
  P(56,94,"#e4e4d0",4,3);
  P(63,94,"#e4e4d0",4,3);

  // 首
  P(57,36,c[0],19,29);
  P(61,34,c[1],14,27);
  P(64,40,c[2],8,18);

  // 頭
  P(57,17,c[0],31,26);
  P(60,14,c[1],25,25);
  P(64,12,c[2],17,19);

  // 角
  P(62,6,c[0],6,11);
  P(61,3,c[3],3,5);
  P(78,7,c[0],5,10);
  P(80,4,c[3],3,5);

  // 鼻先
  P(80,29,c[0],17,9);
  P(84,28,c[1],13,7);

  // 目
  P(78,20,"#ffffff",6,6);
  P(80,21,"#171b22",3,4);
  P(81,21,"#ffffff",1,1);

  // 鼻孔
  P(91,31,c[0],2,2);
  P(95,31,c[0],2,2);

  // 鱗模様
  for(let i=0;i<22;i++) {

    const x=28+(i*13)%37;
    const y=53+(i*7)%25;

    P(x,y,c[3],2,1);
    P(x+1,y+1,c[0],1,1);

  }

  // 首のトゲ
  for(let i=0;i<6;i++) {

    P(63+i*4,10-i%2*2,c[0],3,5);

  }

  // 口
  P(87,35,"#291c20",9,2);

  if(action==="eat") {

    drawApple(94,32,0.8);

  }

  if(action==="fly") {

    // 飛行時の風
    P(2,45,"#d5e9f4",10,2);
    P(3,53,"#d5e9f4",7,1);

  }

  if(mood==="scary") {

    P(76,19,"#d92e34",7,3);
    P(85,34,"#ffffff",3,4);

  }

  if(mood==="cute") {

    P(76,19,"#ffffff",6,6);
    P(78,20,"#29202c",2,3);

    P(86,39,"#f29aa7",4,2);

  }

}


// ==================================================
// 5. リンゴ・食べ物
// ==================================================

function drawApple(x,y,s=1) {

  const r=Math.max(1,Math.round(s));

  P(x+5*r,y, "#347447",3*r,2*r);
  P(x+7*r,y-2*r,"#39864c",4*r,2*r);

  P(x+2*r,y+2*r,"#a52e36",13*r,12*r);
  P(x,y+5*r,"#c63c42",17*r,8*r);
  P(x+4*r,y+2*r,"#ec5b5b",8*r,10*r);
  P(x+5*r,y+4*r,"#ff9290",3*r,3*r);

  P(x+12*r,y+6*r,"#8b252c",3*r,5*r);

}

function drawBanana(x,y) {

  P(x+5,y+4,"#f2d34f",15,4);
  P(x+3,y+7,"#f2d34f",17,4);
  P(x+5,y+11,"#d5a83a",12,3);
  P(x+3,y+5,"#fff0a0",12,2);

}

function drawMeat(x,y) {

  P(x,y+4,"#873c36",17,9);
  P(x+2,y+2,"#c66b62",12,10);
  P(x+5,y+4,"#f4c2a0",6,4);
  P(x+17,y+5,"#e5dfd4",4,5);

}


// ==================================================
// 6. 猫
// ==================================================

function drawCat(color="white",action="normal") {

  const c=palette(color);

  // 尻尾
  P(14,67,c[0],5,22);
  P(10,63,c[1],7,8);

  // 胴体
  P(24,54,c[0],45,31);
  P(28,52,c[1],35,29);
  P(35,61,c[2],20,15);

  // 頭
  P(23,24,c[0],46,34);
  P(27,22,c[1],38,32);

  // 耳
  P(23,12,c[0],14,21);
  P(27,16,"#d58b9d",6,11);
  P(54,12,c[0],14,21);
  P(58,16,"#d58b9d",6,11);

  // 目
  P(33,35,"#ffffff",9,8);
  P(54,35,"#ffffff",9,8);
  P(37,36,"#252d34",3,7);
  P(58,36,"#252d34",3,7);

  // 鼻
  P(45,45,"#d66b88",5,3);

  // 口
  line(47,48,45,51,"#3a2730");
  line(47,48,50,51,"#3a2730");

  // ひげ
  line(28,45,40,47,c[3]);
  line(28,49,39,49,c[3]);
  line(53,47,65,45,c[3]);
  line(53,49,66,50,c[3]);

  // 足
  P(28,80,c[0],11,15);
  P(52,80,c[0],11,15);

  if(action==="eat") {
    drawApple(62,59,.6);
  }

}


// ==================================================
// 7. 犬・狼
// ==================================================

function drawDog(color="brown") {

  const c=palette(color);

  // 尻尾
  P(11,58,c[0],7,20);
  P(8,53,c[1],7,8);

  // 胴体

function renderScene(data) {

  drawBackground(data.background);

  const entities=data.entities;

  if(!entities.length) {
    drawTree();
    return;
  }

  // 建物など背景向けの要素を先に描く
  const backgroundTypes=["castle","house","mountain","tree"];

  entities.filter(e=>backgroundTypes.includes(e.type))
    .forEach(e=>{

      ctx.save();
      ctx.translate(0,0);
      ctx.scale(1,1);

      drawEntity(e.type,data.color,"normal","normal");

      ctx.restore();

    });

  // 主体
  const main=data.primary;

  if(main) {

    const secondary=entities.filter(e=>e!==main);

    // 主体の大きさ
    const scale=data.size;

    ctx.save();

    if(secondary.length) {

      // 2体以上の場合は少し小さく配置
      ctx.translate(12,24);
      ctx.scale(.76,.76);

    } else {

      ctx.translate(0,0);
      ctx.scale(scale,scale);

    }

    const action=main===data.primary ? data.action : "normal";

    drawEntity(
      main.type,
      data.color || "green",
      action,
      data.mood
    );

    ctx.restore();

    // 2体目以降
    secondary
      .filter(e=>!backgroundTypes.includes(e.type))
      .slice(0,3)
      .forEach((e,i)=>{

        ctx.save();

        ctx.translate(61+i*8,43+i*3);
        ctx.scale(.52,.52);

        drawEntity(
          e.type,
          data.color || "blue",
          "normal",
          "normal"
        );

        ctx.restore();

      });

  }

  // 持つ・運ぶ動作に応じて道具を配置
  if(data.action==="hold" || data.action==="carry") {

    const tool=entities.find(e=>
      ["sword","shield","staff","watering"].includes(e.type)
    );

    if(tool) {

      ctx.save();
      ctx.translate(0,0);
      ctx.scale(.55,.55);
      drawEntity(tool.type,"gold","normal","normal");
      ctx.restore();

    }

  }

  // 食べる対象
  if(data.action==="eat" && data.target) {

    const food=data.target.type;

    ctx.save();
    ctx.translate(75,43);
    ctx.scale(.65,.65);

    if(food==="apple") drawApple(0,0,1);
    if(food==="banana") drawBanana(0,0);
    if(food==="meat") drawMeat(0,0);

    ctx.restore();

  }

  // 花や草など追加の背景要素
  if(entities.some(e=>e.type==="flower") &&
     main.type!=="flower") {

    ctx.save();
    ctx.translate(2,60);
    ctx.scale(.45,.45);
    drawFlower();
    ctx.restore();

  }

}


// ==================================================
// 13. 生成・解析結果
// ==================================================

function generate() {

  const text=document.getElementById("prompt").value.trim();

  if(!text) {
    alert("描きたい内容を入力してください。");
    return;
  }

  const status=document.getElementById("status");
  const report=document.getElementById("analysis");

  status.textContent="文章構造を解析中...";

  const data=AI.analyze(text);

  status.textContent="シーンの構図を設計中...";

  ctx.clearRect(0,0,128,128);

  renderScene(data);

  const entityText=data.entities.length
    ? data.entities.map(e=>e.word+" ["+e.type+"]").join(" / ")
    : "認識できる要素なし";

  const actionNames={
    eat:"食べる",
    hold:"持つ",
    fly:"飛ぶ",
    run:"走る",
    walk:"歩く",
    sit:"座る",
    sleep:"眠る",
    swim:"泳ぐ",
    fight:"戦う",
    water:"水をあげる",
    look:"見る",
    carry:"運ぶ"
  };

  const moodNames={
    cute:"かわいい",
    scary:"恐ろしい",
    normal:"通常"
  };

  report.innerHTML=

    "<b>AI解析レポート v3.0</b><br>"+
    "入力文："+escapeHTML(text)+"<br>"+
    "認識した要素："+entityText+"<br>"+
    "主体："+(data.primary?.word || "不明")+"<br>"+
    "対象："+(data.target?.word || "なし")+"<br>"+
    "動作："+(actionNames[data.action] || "指定なし")+"<br>"+
    "色："+(data.color || "標準色")+"<br>"+
    "背景："+data.background+"<br>"+
    "雰囲気："+moodNames[data.mood]+"<br>"+
    "大きさ："+(data.size>1?"巨大":data.size<1?"小型":"通常")+"<br>"+
    "解像度：128×128";

  status.textContent="生成完了！";

}

function escapeHTML(str) {

  return str.replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);

}

function example(text) {

  document.getElementById("prompt").value=text;
  generate();

}

function clearCanvas() {

  ctx.clearRect(0,0,128,128);

  document.getElementById("status").textContent="生成待機中...";
  document.getElementById("analysis").textContent="AI解析エンジン：待機中";

}

function downloadImage() {

  const link=document.createElement("a");

  link.download="pixel-ai-v3.png";
  link.href=canvas.toDataURL("image/png");

  link.click();

}

document.getElementById("prompt")
.addEventListener("keydown",e=>{

  if(e.key==="Enter") generate();

});
